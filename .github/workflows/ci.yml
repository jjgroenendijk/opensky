name: CI

# GH Actions CPU quota exhausted (2026-07-20) -> automatic runs disabled.
# The git hooks (.githooks/, wired by `make bootstrap`) format and lint; no hook
# builds or runs the tests (testing-and-verifying skill). Manual dispatch kept so the workflow can verify a branch when quota
# returns; restoring pull_request/push triggers + required status checks on
# main re-enables CI (see GitHub issue #70).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format & lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftformat swiftlint markdownlint-cli2 shellcheck jscpd
      - name: Format check
        run: make format-check
      - name: Lint (strict)
        run: make lint
      - name: Docs links
        run: make docs-links

  build-test:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode version
        id: xcode
        # Project needs Xcode 26+ (macOS 26 SDK, Metal 4, project format 26.3).
        # Hosted runners may lag; skip the build explicitly instead of failing
        # on an unbuildable toolchain.
        run: |
          major=$(xcodebuild -version | awk '/^Xcode/{print int($2)}')
          echo "major=$major" >> "$GITHUB_OUTPUT"
          if [ "$major" -lt 26 ]; then
            echo "::warning::Xcode $major < 26 on runner; build/test skipped." \
              "A future macos-26 runner covers this job."
          fi
      - name: Swift baseline (>= 6.3.3, Swift 6 language mode)
        # Gated with the rest of this job: a runner too old for Xcode 26 is also
        # too old for the compiler baseline, and skipping is already the policy
        # there. The same script runs unconditionally in the local pre-commit
        # hook and in `make check`.
        if: ${{ steps.xcode.outputs.major >= 26 }}
        run: make swift-baseline
      - name: Install Metal Toolchain
        if: ${{ steps.xcode.outputs.major >= 26 }}
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build vendored ffmpeg
        if: ${{ steps.xcode.outputs.major >= 26 }}
        # The app and CLI targets link the vendored decode-only ffmpeg, and a fresh
        # checkout has no .vendor, so the "Check vendored ffmpeg" build phase would
        # fail the build before any test runs.
        run: make ffmpeg
      - name: Build & test (unit)
        if: ${{ steps.xcode.outputs.major >= 26 }}
        run: make test XCODEBUILD_FLAGS='CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='
      - name: Compile real-data suites (never run: no install on a runner)
        if: ${{ steps.xcode.outputs.major >= 26 }}
        run: make realdata-build XCODEBUILD_FLAGS='CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='
      - name: Dead-code scan (Periphery, against the baseline)
        # Builds uncached into its own tree: a build replayed from the
        # compilation cache writes almost no index data for Periphery to read.
        if: ${{ steps.xcode.outputs.major >= 26 }}
        run: |
          brew install periphery
          make dead-code XCODEBUILD_FLAGS='CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='
      - name: UI tests
        if: ${{ steps.xcode.outputs.major >= 26 }}
        run: make test-ui XCODEBUILD_FLAGS='CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM='
