name: CI

# Every job runs on macOS, like a developer machine (docs/tools/ci.md). Each step
# runs the same make target as `make check`. The lint checks share two jobs, so one
# run uses at most 3 macOS runners at a time; the Free plan allows 5 per account.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned tool versions. Change a pin together with the local Homebrew version.
env:
  SWIFTFORMAT_VERSION: 0.63.1
  SWIFTLINT_VERSION: 0.65.1
  MARKDOWNLINT_VERSION: 0.23.3
  SHELLCHECK_VERSION: v0.11.0
  ACTIONLINT_VERSION: 1.7.12
  JSCPD_VERSION: 5.4.0

jobs:
  format:
    name: Format
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/ci-tools
            ~/.npm
          key: tools-format-${{ env.SWIFTFORMAT_VERSION }}-${{ env.MARKDOWNLINT_VERSION }}
      - name: Install SwiftFormat and markdownlint-cli2
        run: |
          TOOLS_DIR="$HOME/ci-tools"
          mkdir -p "$TOOLS_DIR"
          if [ ! -x "$TOOLS_DIR/swiftformat" ]; then
            curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
              "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
            unzip -q -o -d "$TOOLS_DIR" "$RUNNER_TEMP/swiftformat.zip" swiftformat
          fi
          echo "$TOOLS_DIR" >>"$GITHUB_PATH"
          npm install --global --no-audit --no-fund "markdownlint-cli2@$MARKDOWNLINT_VERSION"
      - run: make swift-format-check
      # The shaders use Xcode's clang-format, as locally.
      - if: success() || failure()
        run: make metal-format-check
      - if: success() || failure()
        run: make md-lint

  static-checks:
    name: Static checks
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/ci-tools
            ~/.npm
          key: tools-static-${{ env.SWIFTLINT_VERSION }}-${{ env.SHELLCHECK_VERSION }}-${{ env.ACTIONLINT_VERSION }}-${{ env.JSCPD_VERSION }}
      # actionlint also runs shellcheck on each `run:` script, so both share the pin.
      - name: Install SwiftLint, shellcheck, actionlint, and jscpd
        run: |
          TOOLS_DIR="$HOME/ci-tools"
          mkdir -p "$TOOLS_DIR"
          if [ ! -x "$TOOLS_DIR/swiftlint" ]; then
            curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
              "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
            unzip -q -o -d "$TOOLS_DIR" "$RUNNER_TEMP/swiftlint.zip" swiftlint
          fi
          if [ ! -x "$TOOLS_DIR/shellcheck" ]; then
            curl -fsSL \
              "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.darwin.aarch64.tar.xz" \
              | tar -xJ -C "$TOOLS_DIR" --strip-components=1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          fi
          if [ ! -x "$TOOLS_DIR/actionlint" ]; then
            curl -fsSL \
              "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_darwin_arm64.tar.gz" \
              | tar -xz -C "$TOOLS_DIR" actionlint
          fi
          echo "$TOOLS_DIR" >>"$GITHUB_PATH"
          npm install --global --no-audit --no-fund "jscpd@$JSCPD_VERSION"
      - run: make swift-lint
      - if: success() || failure()
        run: make sh-lint workflow-lint
      - if: success() || failure()
        run: make module-graph
      - if: success() || failure()
        run: >-
          make cli-boundary realdata-plan lint-test-plans lint-test-tags lint-test-targets no-game-content docs-links
          docs-length agent-files comment-length duplicates no-suppressions

  # Only tests that need no game data: a runner has no install, and the job sets no
  # OPENSKY_DATA_ROOT, so a gated test skips. The real-data suites only compile.
  build-test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SIGNING: CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
    steps:
      - uses: actions/checkout@v4
      # Tests that need a Metal 4 GPU skip when this prints false.
      - name: Show Xcode and GPU
        run: |
          xcodebuild -version
          printf '%s\n' 'import Metal' \
            'let d = MTLCreateSystemDefaultDevice()' \
            'print(d?.name ?? "no device", "metal4:", d?.supportsFamily(.metal4) ?? false)' \
            >"$RUNNER_TEMP/gpu.swift"
          swift "$RUNNER_TEMP/gpu.swift"
      - run: make swift-baseline
      # One run then lists the compile errors of every target, not only the first.
      - name: Keep building after errors
        run: defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      # Restore and save apart, so a failing test does not throw away the build.
      - uses: actions/cache/restore@v4
        id: ffmpeg
        with:
          path: .vendor/ffmpeg
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('tools/vendor-ffmpeg.sh') }}
      # The app and CLI link the vendored ffmpeg, and a fresh checkout has none.
      - run: make ffmpeg
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vendor/ffmpeg
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      # The compilation cache roughly halves the build. Only main saves it, because
      # one entry is about 430 MB and the repository keeps 10 GB of caches. A
      # restored cache only grows, so the key starts over each month.
      - name: Cache key month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: cas
        with:
          path: DerivedData/CompilationCache.noindex
          key: cas-${{ runner.arch }}-${{ steps.month.outputs.month }}-${{ github.run_id }}
          restore-keys: cas-${{ runner.arch }}-${{ steps.month.outputs.month }}-
      - run: make test-unit XCODEBUILD_FLAGS="$SIGNING"
      - run: make coverage-floor
      - name: "Compile real-data suites (never run: no install on a runner)"
        run: make realdata-build XCODEBUILD_FLAGS="$SIGNING"
      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: DerivedData/CompilationCache.noindex
          key: ${{ steps.cas.outputs.cache-primary-key }}
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: logs/
          retention-days: 7

  # The one required status check on main. A new job goes into `needs`, and branch
  # protection needs no change.
  lint:
    name: Lint
    if: always()
    needs: [format, static-checks, build-test]
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
