name: CI

# The checks run on macOS, like a developer machine (docs/tools/ci.md). Format and
# Static checks run the two halves of `make check`, so the gates are the same by
# construction, and Build & test runs `make test`. The checks share two jobs, so one
# run uses at most 4 macOS runners at a time; the Free plan allows 5 per account.
# The Changes and Lint jobs only read results, so they run on Linux.
# A draft pull request runs too, so the full unit plan runs on a runner while the
# author keeps working; a newer push cancels the older run. Marking a draft ready
# starts no run, because the last push already tested the same commit.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pinned tool versions. Renovate bumps them to the newest release, as Homebrew does
# locally. Each `renovate:` comment names where the version comes from.
env:
  # renovate: datasource=github-releases depName=nicklockwood/SwiftFormat
  SWIFTFORMAT_VERSION: 0.64.5
  # renovate: datasource=github-releases depName=realm/SwiftLint
  SWIFTLINT_VERSION: 0.65.1
  # renovate: datasource=npm depName=markdownlint-cli2
  MARKDOWNLINT_VERSION: 0.24.0
  # renovate: datasource=github-releases depName=koalaman/shellcheck
  SHELLCHECK_VERSION: v0.11.0
  # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.+)$
  ACTIONLINT_VERSION: 1.7.12
  # renovate: datasource=npm depName=jscpd
  JSCPD_VERSION: 5.4.2
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.6
  # The image holds several Xcodes and its default moves. Name the one that matches the
  # local Xcode; `tools/lint/swift-baseline.sh` fails when the Swift versions differ.
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  # The build cache and the compilation cache store inside the workspace, where the
  # cache actions find them, under a hidden folder that xcodebuild's start-up scan
  # of the package root skips. Locally both default to paths outside the checkout.
  OPENSKY_DERIVED_DATA: ${{ github.workspace }}/.cache/DerivedData
  OPENSKY_COMPILATION_CACHE: ${{ github.workspace }}/.cache/CompilationCache.noindex
  # Inside the build tree, not beside it: a build prunes these modules at its end, and
  # under the package root that reloaded the package graph before the tests.
  OPENSKY_SDK_MODULES: ${{ github.workspace }}/.cache/DerivedData/SDKExplicitPrecompiledModules

jobs:
  format:
    name: Format
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/ci-tools
            ~/.npm
          key: tools-format-${{ env.SWIFTFORMAT_VERSION }}-${{ env.MARKDOWNLINT_VERSION }}
      - name: Install SwiftFormat and markdownlint-cli2
        run: |
          TOOLS_DIR="$HOME/ci-tools"
          mkdir -p "$TOOLS_DIR"
          if [ ! -x "$TOOLS_DIR/swiftformat" ]; then
            curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
              "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
            unzip -q -o -d "$TOOLS_DIR" "$RUNNER_TEMP/swiftformat.zip" swiftformat
          fi
          echo "$TOOLS_DIR" >>"$GITHUB_PATH"
          npm install --global --no-audit --no-fund "markdownlint-cli2@$MARKDOWNLINT_VERSION"
      # The Python tools pin ruff in their uv.lock, so CI needs only uv.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: make format-check

  static-checks:
    name: Static checks
    runs-on: xcode-27
    timeout-minutes: 10
    # The module size check reads whether each exception's split issue is open.
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/ci-tools
            ~/.npm
          key: tools-static-${{ env.SWIFTLINT_VERSION }}-${{ env.SWIFTFORMAT_VERSION }}-${{ env.SHELLCHECK_VERSION }}-${{ env.ACTIONLINT_VERSION }}-${{ env.JSCPD_VERSION }}
      # actionlint also runs shellcheck on each `run:` script, so both share the pin.
      # The fakes check formats its fresh copy before it compares, so it needs SwiftFormat.
      - name: Install SwiftLint, SwiftFormat, shellcheck, actionlint, and jscpd
        run: |
          TOOLS_DIR="$HOME/ci-tools"
          mkdir -p "$TOOLS_DIR"
          if [ ! -x "$TOOLS_DIR/swiftlint" ]; then
            curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
              "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
            unzip -q -o -d "$TOOLS_DIR" "$RUNNER_TEMP/swiftlint.zip" swiftlint
          fi
          if [ ! -x "$TOOLS_DIR/swiftformat" ]; then
            curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
              "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
            unzip -q -o -d "$TOOLS_DIR" "$RUNNER_TEMP/swiftformat.zip" swiftformat
          fi
          if [ ! -x "$TOOLS_DIR/shellcheck" ]; then
            curl -fsSL \
              "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.darwin.aarch64.tar.xz" \
              | tar -xJ -C "$TOOLS_DIR" --strip-components=1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          fi
          if [ ! -x "$TOOLS_DIR/actionlint" ]; then
            curl -fsSL \
              "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_darwin_arm64.tar.gz" \
              | tar -xz -C "$TOOLS_DIR" actionlint
          fi
          echo "$TOOLS_DIR" >>"$GITHUB_PATH"
          npm install --global --no-audit --no-fund "jscpd@$JSCPD_VERSION"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: make lint

  # Decides whether Build & test runs. A pull request that changes only Markdown, docs,
  # skills, the Python tools, the markdownlint config, or the Renovate config skips it.
  # Static checks still lint and test those. So does a run that starts after its pull
  # request merged: the push to main builds the same tree. Any other event always builds.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          build=true
          state=OPEN
          if [ -n "$PR" ]; then state="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)"; fi
          if [ "$state" != OPEN ]; then
            echo "[INFO] pull request #$PR is $state"
            build=false
          elif [ -n "$PR" ] && files="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)"; then
            build=false
            for file in $files; do
              case "$file" in
                *.md | docs/* | .agents/* | .claude/* | .github/renovate.json) ;;
                tools/wiki-mirror/* | tools/markdown/*) ;;
                *) build=true ;;
              esac
            done
          fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  # Picks the runner of Build & test and Index checks (docs/tools/ci.md#self-hosted-runner).
  # Only a pull request that the owner opened from a branch of this repository may use
  # the self-hosted Mac, and only while it is online. Every other run, and every run
  # without the RUNNER_STATUS_TOKEN secret, takes a hosted runner.
  runner:
    name: Runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
      hosted: ${{ steps.pick.outputs.hosted }}
      developer-dir: ${{ steps.pick.outputs.developer-dir }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          OWNER_PR: >-
            ${{ github.event_name == 'pull_request'
            && github.event.pull_request.user.login == github.repository_owner
            && github.event.pull_request.head.repo.full_name == github.repository }}
          SELF_HOSTED_LABELS: '["self-hosted","macOS","ARM64"]'
        run: |
          online=0
          if [ "$OWNER_PR" != true ]; then
            echo "[INFO] not a pull request by the owner from this repository"
          elif [ -z "$GH_TOKEN" ]; then
            echo "[WARNING] the RUNNER_STATUS_TOKEN secret is not set"
          elif runners="$(gh api "repos/$GITHUB_REPOSITORY/actions/runners")"; then
            online="$(echo "$runners" | jq --argjson want "$SELF_HOSTED_LABELS" \
              '[.runners[] | select(.status == "online" and ([.labels[].name] | contains($want)))] | length')"
          else
            echo "[WARNING] cannot read the runner list"
          fi
          if [ "$online" -gt 0 ]; then
            echo "[INFO] $online self-hosted runner(s) online"
            {
              echo "labels=$SELF_HOSTED_LABELS"
              echo "hosted=false"
              echo "developer-dir=/Applications/Xcode.app/Contents/Developer"
            } | tee -a "$GITHUB_OUTPUT"
          else
            {
              echo 'labels=["xcode-27"]'
              echo "hosted=true"
              echo "developer-dir=$DEVELOPER_DIR"
            } | tee -a "$GITHUB_OUTPUT"
          fi

  # Only tests that need no game data: a runner has no install, and the job sets no
  # OPENSKY_DATA_ROOT, so a gated test skips. Index checks compiles the real-data suites.
  build-test:
    name: Build & test
    needs: [changes, runner]
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      pull-requests: read
    env:
      DEVELOPER_DIR: ${{ needs.runner.outputs.developer-dir }}
      # Signing, then CI-only speed settings: no index data, which nothing in CI reads,
      # and no plugin or macro trust prompt.
      BUILD_FLAGS: >-
        CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= COMPILER_INDEX_STORE_ENABLE=NO
        -skipPackagePluginValidation -skipMacroValidation
      # A restored compilation cache only grows. Main starts over above this size.
      # One cold build alone is about 2 GB, so the limit must stay well above that.
      CAS_MAX_MB: 5120
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Depth 2 keeps the merge commit's base, which the changed-lines check diffs against.
      # The self-hosted Mac keeps its build tree and vendored libraries between runs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          clean: ${{ needs.runner.outputs.hosted == 'true' }}
      - name: Clean all but the build tree
        if: needs.runner.outputs.hosted != 'true'
        run: git clean -ffdx -e .cache/ -e src/.vendor/
      # The download overlaps the steps up to "Wait for the Metal Toolchain".
      - name: Start Metal Toolchain download
        run: tools/ci/metal-toolchain.sh start
      # Tests that need a Metal 4 GPU skip unless this shows Metal 4. The runner's
      # virtual GPU may list no Metal line at all.
      - name: Show Xcode and GPU
        run: |
          xcodebuild -version
          system_profiler SPDisplaysDataType
      # One run then lists the compile errors of every target, not only the first.
      - name: Keep building after errors
        run: defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES
      # Restore and save apart, so a failing test does not throw away the build.
      # The self-hosted Mac uses no GitHub cache: its own tree is newer and local.
      - uses: actions/cache/restore@v6
        id: ffmpeg
        if: needs.runner.outputs.hosted == 'true'
        with:
          path: src/.vendor/ffmpeg
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('tools/vendor-ffmpeg.sh') }}
      # The app and CLI link the vendored ffmpeg, and a fresh checkout has none.
      - run: tools/vendor-ffmpeg.sh
      - if: steps.ffmpeg.outcome == 'success' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: src/.vendor/ffmpeg
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}
      - uses: actions/cache/restore@v6
        id: astcenc
        if: needs.runner.outputs.hosted == 'true'
        with:
          path: src/.vendor/astcenc
          key: astcenc-${{ runner.arch }}-${{ hashFiles('tools/vendor-astcenc.sh') }}
      # The ASTC texture encoder links the vendored astcenc static library.
      - run: tools/vendor-astcenc.sh
      - if: steps.astcenc.outcome == 'success' && steps.astcenc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: src/.vendor/astcenc
          key: ${{ steps.astcenc.outputs.cache-primary-key }}
      # A pull request keeps its own compilation cache and falls back to main's.
      - name: Cache keys
        id: keys
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          echo "xcode=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >>"$GITHUB_OUTPUT"
          if [ -n "$PR" ]; then scope="pr-$PR"; else scope="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"; fi
          echo "cas=cas2-$RUNNER_ARCH-$scope-" >>"$GITHUB_OUTPUT"
      # The SDK's precompiled modules and stat cache change only with Xcode.
      - uses: actions/cache/restore@v6
        id: sdk
        if: needs.runner.outputs.hosted == 'true'
        with:
          path: |
            .cache/DerivedData/ModuleCache.noindex
            .cache/DerivedData/SDKStatCaches.noindex
          key: sdk2-${{ runner.arch }}-${{ steps.keys.outputs.xcode }}
      - uses: actions/cache/restore@v6
        id: cas
        if: needs.runner.outputs.hosted == 'true'
        with:
          path: .cache/CompilationCache.noindex
          key: ${{ steps.keys.outputs.cas }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.keys.outputs.cas }}
            cas2-${{ runner.arch }}-main-
      # COMPILATION_CACHE_LIMIT_SIZE does not shrink the store, so main drops it when too
      # big. The self-hosted store is never saved, so it is checked on every run.
      - name: Start the compilation cache over when too big
        if: github.event_name == 'push' || needs.runner.outputs.hosted != 'true'
        run: |
          store=.cache/CompilationCache.noindex
          size="$(du -sm "$store" 2>/dev/null | cut -f1)"
          echo "[INFO] compilation cache: ${size:-0} MB, limit $CAS_MAX_MB MB"
          if [ "${size:-0}" -gt "$CAS_MAX_MB" ]; then rm -rf "$store"; fi
      - name: Wait for the Metal Toolchain
        run: tools/ci/metal-toolchain.sh wait
      # The whole unit plan with coverage, its floors, and the changed lines: locally the
      # default is the Quick plan without coverage, so this is the one run that sees every
      # test. A pull request checks out its merge commit, whose first parent is the base.
      - run: make test PLAN=UnitTests COVERAGE=1 DIFF_BASE="$DIFF_BASE" XCODEBUILD_FLAGS="$BUILD_FLAGS"
        env:
          DIFF_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
      - if: steps.sdk.outcome == 'success' && steps.sdk.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/DerivedData/ModuleCache.noindex
            .cache/DerivedData/SDKStatCaches.noindex
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      # A pull request that closed during the build saves nothing, and the next step then
      # deletes its older caches, because nothing can restore them any more.
      - name: Check the pull request is still open
        id: pr
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.cas.outcome == 'success' }}
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          state="$(gh pr view "$PR" --json state --jq .state)"
          echo "[INFO] pull request #$PR is $state"
          [ "$state" = OPEN ] || echo "closed=true" >>"$GITHUB_OUTPUT"
      # Saved after a failed test too, because the compiled tasks are still valid.
      - if: ${{ !cancelled() && steps.cas.outcome == 'success' && steps.pr.outputs.closed != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/CompilationCache.noindex
          key: ${{ steps.cas.outputs.cache-primary-key }}
      - name: Delete superseded compilation caches
        if: ${{ !cancelled() && steps.cas.outcome == 'success' }}
        env:
          PREFIX: ${{ steps.keys.outputs.cas }}
          KEEP: ${{ steps.cas.outputs.cache-primary-key }}
        run: tools/ci/cache-prune.sh "$GITHUB_REF" "$PREFIX" "$KEEP"
      - name: Build timing summary
        if: ${{ !cancelled() }}
        run: tools/ci/build-timing.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload build and test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-test-logs
          path: .logs/
          include-hidden-files: true
          retention-days: 7

  # The checks that read the index store: unused code and the adapter rule. A build
  # replayed from the compilation cache writes almost no index data, so this job builds
  # uncached on its own runner, beside Build & test. It starts from the index tree of
  # the last push to main, so it compiles only what changed (docs/tools/ci.md#index-checks).
  index-checks:
    name: Index checks
    needs: [changes, runner]
    if: needs.changes.outputs.build == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      DEVELOPER_DIR: ${{ needs.runner.outputs.developer-dir }}
      BUILD_FLAGS: CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -skipPackagePluginValidation -skipMacroValidation
      GH_TOKEN: ${{ github.token }}
      INDEX_TREE: .cache/DerivedData-index
    steps:
      # The self-hosted Mac keeps its index tree, whose file times stay right, because
      # a checkout there rewrites only the files that changed.
      - uses: actions/checkout@v7
        with:
          clean: ${{ needs.runner.outputs.hosted == 'true' }}
      - name: Clean all but the build tree
        if: needs.runner.outputs.hosted != 'true'
        run: git clean -ffdx -e .cache/ -e src/.vendor/
      - name: Cache keys
        id: keys
        run: |
          xcode="$(xcodebuild -version | awk '/Build version/ { print $3 }')"
          echo "index=index1-$RUNNER_ARCH-$xcode-" >>"$GITHUB_OUTPUT"
      # Only a push to main saves the tree, because it is about 1.1 GB.
      - uses: actions/cache/restore@v6
        id: index
        if: needs.runner.outputs.hosted == 'true'
        with:
          path: |
            .cache/DerivedData-index
            .cache/DerivedData/SDKExplicitPrecompiledModules
          key: ${{ steps.keys.outputs.index }}${{ github.sha }}
          restore-keys: ${{ steps.keys.outputs.index }}
      # A checkout writes every file now, which would make the build compile all of it.
      - name: Give the sources the times the restored tree expects
        if: needs.runner.outputs.hosted == 'true'
        run: tools/ci/source-times.sh "$(cat "$INDEX_TREE/source-commit" 2>/dev/null || true)"
      - name: Start Metal Toolchain download
        run: tools/ci/metal-toolchain.sh start
      - uses: actions/cache/restore@v6
        if: needs.runner.outputs.hosted == 'true'
        with:
          path: src/.vendor/ffmpeg
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('tools/vendor-ffmpeg.sh') }}
      - run: tools/vendor-ffmpeg.sh
      - uses: actions/cache/restore@v6
        if: needs.runner.outputs.hosted == 'true'
        with:
          path: src/.vendor/astcenc
          key: astcenc-${{ runner.arch }}-${{ hashFiles('tools/vendor-astcenc.sh') }}
      - run: tools/vendor-astcenc.sh
      # Periphery is the one tool the CI image does not ship. The cask in the
      # periphery tap no longer installs, so take the Homebrew core formula.
      - run: brew install periphery
      - name: Wait for the Metal Toolchain
        run: tools/ci/metal-toolchain.sh wait
      - run: make lint-index XCODEBUILD_FLAGS="$BUILD_FLAGS"
      # Saved after failed checks too, because the build itself is still valid.
      - name: Record the commit the tree was built from
        if: ${{ !cancelled() && github.event_name == 'push' && steps.index.outputs.cache-hit != 'true' }}
        run: git rev-parse HEAD >"$INDEX_TREE/source-commit"
      - if: ${{ !cancelled() && github.event_name == 'push' && steps.index.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/DerivedData-index
            .cache/DerivedData/SDKExplicitPrecompiledModules
          key: ${{ steps.index.outputs.cache-primary-key }}
      - name: Delete superseded index trees
        if: ${{ !cancelled() && github.event_name == 'push' && steps.index.outputs.cache-hit != 'true' }}
        env:
          PREFIX: ${{ steps.keys.outputs.index }}
          KEEP: ${{ steps.index.outputs.cache-primary-key }}
        run: tools/ci/cache-prune.sh "$GITHUB_REF" "$PREFIX" "$KEEP"
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: index-checks-logs
          path: .logs/
          include-hidden-files: true
          retention-days: 7

  # The one required status check on main. A new job goes into `needs`, and branch
  # protection needs no change. Build & test may skip only when Changes said so.
  lint:
    name: Lint
    if: ${{ always() }}
    needs: [changes, runner, format, static-checks, build-test, index-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          BUILD_NEEDED: ${{ needs.changes.outputs.build }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          INDEX_RESULT: ${{ needs.index-checks.result }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || [ "$result" = skipped ] || exit 1
          done
          [ "$BUILD_NEEDED" = false ] || { [ "$BUILD_RESULT" = success ] && [ "$INDEX_RESULT" = success ]; }
