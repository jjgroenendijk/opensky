name: Weekly checks

# The unit tests under each sanitizer. Each one rebuilds everything with
# instrumentation, too slow for every push, so they run on a macOS runner once a
# week and on demand (docs/tools/ci.md). A failed run opens an issue, or comments
# on the open one, and a green run closes it.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      force_failure:
        description: Fail at once, to test the issue step
        type: boolean
        default: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  OPENSKY_DERIVED_DATA: ${{ github.workspace }}/.cache/DerivedData
  OPENSKY_COMPILATION_CACHE: ${{ github.workspace }}/.cache/CompilationCache.noindex
  BUILD_FLAGS: >-
    CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= COMPILER_INDEX_STORE_ENABLE=NO
    -skipPackagePluginValidation -skipMacroValidation

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Thread sanitizer
            command: make test-sanitize SAN=thread XCODEBUILD_FLAGS="$BUILD_FLAGS"
          - name: Address sanitizer
            command: make test-sanitize SAN=address XCODEBUILD_FLAGS="$BUILD_FLAGS"
    steps:
      - if: inputs.force_failure
        run: exit 1
      - uses: actions/checkout@v7
      - name: Start Metal Toolchain download
        run: tools/ci/metal-toolchain.sh start
      - run: make swift-baseline
      - uses: actions/cache/restore@v6
        id: ffmpeg
        with:
          path: src/.vendor/ffmpeg
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('tools/vendor-ffmpeg.sh') }}
      - run: make ffmpeg
      - uses: actions/cache/restore@v6
        id: astcenc
        with:
          path: src/.vendor/astcenc
          key: astcenc-${{ runner.arch }}-${{ hashFiles('tools/vendor-astcenc.sh') }}
      # The ASTC texture encoder links the vendored astcenc static library.
      - run: make astcenc
      - name: Wait for the Metal Toolchain
        run: tools/ci/metal-toolchain.sh wait
      - run: ${{ matrix.command }}
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-logs
          path: .logs/
          include-hidden-files: true
          retention-days: 14

  report:
    name: Report
    if: ${{ always() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.checks.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - run: tools/ci/weekly-issue.sh "$RESULT" "$RUN_URL"
