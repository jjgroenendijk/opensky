# OpenSky SwiftLint config — strict linting mandatory (AGENTS.md "Code quality").
# `make swift-lint` runs `swiftlint --strict`, so warnings fail the lint too.

# No `included:` here — SwiftLint resolves config paths relative to this file's
# directory (tools/lint/), not the repo root. Callers pass paths explicitly
# (Makefile SWIFT_PATHS).
excluded:
  - .build
  - build
  - DerivedData
  - DerivedData-optimized
  - DerivedData-index
  - Pods
  - "**/*.generated.swift"

# Treat everything seriously: make passes --strict, so any warning fails.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - no_extension_access_modifier
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_imports
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

# "Master" is the TES4 domain term (MAST field, master list — UESP "Skyrim
# Mod:Mod File Format"); renaming would break spec traceability. Allowed for
# that vocabulary only, not as a general opt-out.
inclusive_language:
  override_allowed_terms: [master, masters]

# Legal & IP / reverse-engineering: no force-unwrap/cast on data from external files.
force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: error

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [i, j, k, x, y, z, u, v, w, id, dt, up, r, g, b, a]

type_name:
  min_length: 3
  max_length: 50

file_length:
  warning: 800
  error: 800

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2

# SwiftFormat (--wrapconditions before-first, --enable wrapMultilineStatementBraces)
# breaks a long `if let a, let b, c > 0 {` onto multiple lines and drops the `{`
# onto its own line. Default opening_brace then flags that brace, so the two
# formatters fight and the only escape is hand-restructuring the condition. Let
# SwiftFormat own multi-line condition/signature/header brace placement; still
# catch same-line offenders like `func abc(){}`.
opening_brace:
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
  ignore_multiline_type_headers: true

# GameViewController keeps the view, input, the render loop, and the panel wiring,
# in these two files. Game logic goes in a coordinator in its feature module
# (Sources/AGENTS.md), so no other file may extend it.
custom_rules:
  game_view_controller_extension:
    name: "GameViewController extension"
    regex: '\bextension\s+GameViewController\b'
    excluded: 'Sources/OpenSky/GameView/GameViewController([A-Za-z]*Panels|Hosts)?\.swift$'
    message: "Put game logic in a coordinator in its feature module, not a GameViewController extension"
    severity: error
  perk_entry_point_literal:
    name: "Perk entry point literal"
    regex: 'PerkEntryPoint\(rawValue:\s*[0-9]'
    excluded: '(Sources/OpenSkyProgressionInterface/PerkEntryPoint\+Engine\.swift|Tests/.*)$'
    message: "Name the entry point in PerkEntryPoint+Engine.swift and add it to engineRead, so openskycli gaps sees it"
    severity: error
  papyrus_event_literal:
    name: "Papyrus event literal"
    regex: '"On[A-Z][A-Za-z]+"'
    included: 'Sources/OpenSkyScripting/.*\.swift$'
    excluded: 'Sources/OpenSkyScripting/PapyrusEngineEvents\.swift$'
    message: "Name the event in PapyrusEngineEvents and add it to sent, so openskycli gaps sees it"
    severity: error
  shader_flag_mask:
    name: "Shader flag mask"
    regex: 'shaderFlags[12]\s*&'
    excluded: 'Tests/.*$'
    message: "Read a shader flag through has(_:) and a NIFShaderFlag constant, and list it in lightingRead or effectRead"
    severity: error
  game_setting_reader:
    name: "Game setting reader"
    regex: '(\.setting\(editorID:|func resolve\(store: GameSettingStore\))'
    excluded: '(Tests/.*|Sources/OpenSky(CrimeInterface/(CrimeTexts|CrimeSettings)|CombatInterface/(Archery|Arrow|Combat|Difficulty|MeleeSkillUse|PowerAttack|WeaponDamage)Settings|GameData/(ActorValueDerivation|BarterPricing|CalendarTexts|CharacterLeveling|CraftingSkillUseSettings|InventoryMenuTexts|ItemDefinitionStore\+EnchantedValue|ItemNoticeTexts|MagicTexts|MenuRecordData|PickpocketSettings|ProgressionTexts|RegenerationSettings|SaveTexts|SkillAdvancement|SocialSettings|SoulTexts|SpellCostSettings|SpeechCheckSettings|StaminaSettings|TopicSubtypeTexts|TradeTexts|TrainingSettings)|Inventory/AlchemyRules|ActorPresentation/(FaceAnimationSettings|HeadTrackingSettings)|Magic/(EnchantingSettings|RuneCore|ShoutCore|SoulTrap)|InventoryInterface/(LockpickingSettings|LockTexts|TemperingTexts|VendorRestock)|PerceptionInterface/(DetectionSettings|StealthPoints)|Player/(PlayerBreath|PlayerMovementConfiguration)|WorldState/CellResetLedger)\.swift)$'
    message: "A new settings reader: call it in GapsGatherer.settingsRead and add its file to this rule, so openskycli gaps sees what it reads"
    severity: error
  # attach(world:), wire(host:), setWorld(_:), and the like.
  late_attached_world:
    name: "Late-attached world"
    regex: '\bfunc\s+(attach|wire|connect|bind|set|install)\w*\s*(<[^>]*>)?\(\s*(_\s+)?(\w+World|world|host|\w+Host|port|game|session)\s*:'
    included: 'Sources/OpenSky[A-Z][A-Za-z]*/.*\.swift$'
    message: "Take the world port in the initializer and return commands (docs/engine/coordinators.md)"
    severity: error
  # The composition root is the app shell and the GameViewController files.
  controller_outside_composition_root:
    name: "Controller outside the composition root"
    regex: '\bGameViewController\b'
    included: 'Sources/.*\.swift$'
    excluded: 'Sources/OpenSky/(Shell/.*|GameView/GameViewController[A-Za-z]*)\.swift$'
    excluded_match_kinds: [comment, doccomment, doccomment.field, string]
    message: "Only the composition root names GameViewController; reach the session through a host protocol (docs/engine/coordinators.md)"
    severity: error
  action_returns_text:
    name: "Action returns text"
    regex: '@discardableResult\s+(?:(?:public|internal|package)\s+)?func\s+\w+\((?:[^()]|\([^()]*\))*\)\s*->\s*String\b'
    excluded: '(Sources/OpenSky/|Tests/).*$'
    message: "Return a typed outcome and build its line in a formatter (docs/engine/coordinators.md)"
    severity: error
  # A protocol requirement in a panel seam: no access modifier, no body, no static.
  panel_action_returns_text:
    name: "Panel action returns text"
    regex: '^[ \t]*func\s+\w+\((?:[^()]|\([^()]*\))*\)\s*->\s*String\??[ \t]*$'
    included: 'Sources/OpenSky[A-Z][A-Za-z]*/(.*/)?[A-Za-z]+ControlProviding\.swift$'
    message: "A panel action returns a typed outcome; the panel writes its text (docs/engine/coordinators.md)"
    severity: error
  pure_core_side_effect:
    name: "Pure core side effect"
    regex: '^\s*(@\w+\s+)*import\s+(AppKit|Cocoa|SwiftUI|Metal|MetalKit|MetalFX|QuartzCore|AVFoundation|AVFAudio|AudioToolbox|CoreAudio|GameController|Dispatch|OpenSkyRendering)\b|\b(Date\(\)|Date\.now\b|CACurrentMediaTime\b|DispatchTime\b|ContinuousClock\b|SuspendingClock\b|mach_absolute_time\b|CFAbsoluteTimeGetCurrent\b|systemUptime\b)'
    included: 'Sources/OpenSky[A-Z][A-Za-z]*/(.*/)?[A-Za-z]+Core(\+[A-Za-z]+)?\.swift$'
    excluded_match_kinds: [comment, doccomment, doccomment.field, string]
    message: "A core is pure: no AppKit, Metal, audio, or clock; the shell passes the time in (docs/engine/coordinators.md)"
    severity: error
  renderer_downcast:
    name: "Renderer downcast"
    regex: '\b(frameDriver|renderer)\s+(as[?!]|is)\s'
    included: 'Sources/.*\.swift$'
    excluded_match_kinds: [comment, doccomment, doccomment.field, string]
    message: "Read game state from RenderFrameInput, never by casting the renderer or its driver (docs/engine/architecture.md)"
    severity: error
  papyrus_loose_closure:
    name: "Papyrus loose closure"
    regex: '\b(var|let)\s+\w+\s*:\s*[^=\n{]*->[^{\n]*$'
    included: 'Sources/OpenSkyScripting/PapyrusWorld[A-Za-z]*Bridge[^/]*\.swift$'
    excluded_match_kinds: [comment, doccomment, doccomment.field, string]
    message: "Give the bridge a collaborator through a native family value, not a closure property (docs/engine/coordinators.md)"
    severity: error
  # A closure property or fan-out whose name says frame, tick, or update.
  frame_callback_property:
    name: "Frame callback property"
    regex: '\bvar\s+\w*(Frame|frame|Tick|tick|Update|update)\w*\s*:\s*[^=\n{]*->[^{\n]*$|\b(var|let)\s+\w*(Frame|frame|Tick|tick|Update|update)\w*\s*(=|:)\s*CallbackFanOut\b'
    included: 'Sources/.*\.swift$'
    excluded: 'Sources/OpenSky(World/Session/FrameSchedule|/(Shell|Panels|Launcher)/.*)\.swift$'
    excluded_match_kinds: [comment, doccomment, doccomment.field, string]
    message: "Join the frame through a phase of a FrameSchedule, not a callback (docs/engine/architecture.md)"
    severity: error

reporter: "xcode"
