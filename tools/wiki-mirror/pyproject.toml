[project]
name = "wiki-mirror"
version = "1.0.0"
description = "Download or update offline Markdown copies of the Creation Kit wiki and the UESP wiki"
requires-python = ">=3.13"
# Standard library only. Conversion runs the pandoc binary (`brew install pandoc`).
dependencies = []

[project.scripts]
wiki-mirror = "wiki_mirror.cli:main"

[dependency-groups]
dev = ["ruff>=0.17"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # Conflict with the formatter or with another docstring rule.
  "COM812", "ISC001", "D203", "D213",
  # The repository carries no per-file copyright headers.
  "CPY001",
  # The tool reports progress on stdout.
  "T201",
  # Flags every subprocess call; the commands here are fixed argument lists.
  "S603",
]
